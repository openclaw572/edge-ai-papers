    arxiv_categories:
    - cs.AI
    - cs.CL
    - cs.LG
    - cs.MA
    - cs.SE
    prefer_full_text: true
    search_policy: &id001
      primary_months: 4
      candidate_sources:
      - arxiv
      - semantic_scholar
      - openalex
      - google_scholar
      fallback_windows:
      - name: fallback_4_to_12_months
        start_months_ago: 12
        end_months_ago: 4
      - name: fallback_13_to_36_months
