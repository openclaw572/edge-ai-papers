  edge_ai_security:
    topic_name: Edge AI Security
    description: Research about security, privacy, robustness, and trustworthiness
      of AI models and inference deployed on edge devices, IoT devices, mobile devices,
      embedded hardware, and distributed edge systems. Relevant topics include adversarial
      attacks, model extraction, privacy leakage, secure inference, federated learning
      security, trusted execution environments, on-device AI, and edge-cloud security.
    positive_seed_papers: []
    positive_keywords:
    - edge AI security
    - secure edge inference
    - on-device AI security
    - IoT AI security
    - embedded AI security
    - adversarial attacks edge AI
    - model extraction
    - privacy-preserving inference
    - federated learning security
    - trusted execution environment
    - TEE
    - robust edge intelligence
    negative_keywords:
    - pure image classification
    - traffic control
    - wireless sensor routing
    - blockchain only
    - smart grid optimization
    - robot swarm
    arxiv_categories:
    - cs.CR
    - cs.AI
    - cs.LG
    - cs.NI
    - cs.DC
    - eess.SP
    prefer_full_text: true
    search_policy: *id001
    quality_threshold: *id002
    paper_type: review
